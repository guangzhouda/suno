<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI创作平台 API 文档</title>
    <!-- 使用国内CDN -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/swagger-ui/5.10.0/swagger-ui.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .swagger-ui .topbar {
            display: none;
        }
        #swagger-ui {
            max-width: 1460px;
            margin: 0 auto;
        }
        .api-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .api-header h1 {
            margin: 0;
            font-size: 2em;
        }
        .api-header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="api-header">
        <h1>🎵 AI创作平台 API 文档</h1>
        <p>Suno 音乐生成 + Doubao AI 功能集成</p>
    </div>
    <div id="swagger-ui"></div>

    <!-- 使用国内CDN -->
    <script src="https://cdn.bootcdn.net/ajax/libs/swagger-ui/5.10.0/swagger-ui-bundle.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/swagger-ui/5.10.0/swagger-ui-standalone-preset.min.js"></script>
    <script>
        window.onload = function() {
            try {
                const ui = SwaggerUIBundle({
                    url: '/openapi.json',
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "StandaloneLayout",
                    defaultModelsExpandDepth: 1,
                    defaultModelExpandDepth: 1,
                    docExpansion: "list",
                    filter: true,
                    showRequestHeaders: true,
                    tryItOutEnabled: true
                });
                window.ui = ui;
            } catch (error) {
                console.error('Swagger UI 初始化失败:', error);
                document.getElementById('swagger-ui').innerHTML = `
                    <div style="padding: 40px; text-align: center;">
                        <h2>⚠️ API 文档加载失败</h2>
                        <p>CDN 资源可能无法访问，请尝试以下方法：</p>
                        <ul style="text-align: left; max-width: 600px; margin: 20px auto;">
                            <li>使用 Postman 导入 OpenAPI 规范：<a href="/openapi.json" target="_blank">点击下载 openapi.json</a></li>
                            <li>直接访问 <a href="/api-docs-simple">简化版文档</a></li>
                            <li>查看下方的快速测试示例</li>
                        </ul>
                        <h3>快速测试示例</h3>
                        <pre style="text-align: left; background: #f5f5f5; padding: 15px; border-radius: 5px; max-width: 800px; margin: 20px auto; overflow-x: auto;">
# 测试 Suno 健康检查
curl http://127.0.0.1:8000/api/suno/health

# 查询积分
curl http://127.0.0.1:8000/api/suno/credits

# 生成音乐
curl -X POST http://127.0.0.1:8000/api/suno/generate \\
  -H "Content-Type: application/json" \\
  -d '{"prompt": "轻快的流行歌曲", "model": "V5"}'

# Doubao 生成歌词
curl -X POST http://127.0.0.1:8000/api/doubao/lyrics \\
  -H "Content-Type: application/json" \\
  -d '{"prompt": "写一首关于春天的歌"}'
                        </pre>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
