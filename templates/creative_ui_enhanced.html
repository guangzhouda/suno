<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI创作平台 - 音乐创作工作流</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 40px; }
        .header h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 1.2em; opacity: 0.9; }

        .status-bar {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .status-item { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .workflow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 25px; margin-bottom: 30px; }
        .workflow-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .workflow-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .workflow-card h2 { color: #667eea; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 1.8em; }
        .workflow-card .description { color: #666; margin-bottom: 20px; line-height: 1.6; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input[type="text"], .form-group textarea, .form-group select, .form-group input[type="url"], .form-group input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #667eea; outline: none; }
        .form-group textarea { min-height: 100px; resize: vertical; font-family: inherit; }
        .form-group input[type="checkbox"] { width: auto; margin-right: 8px; }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 4px solid #667eea; }
        .result.success { border-left-color: #4ade80; background: #f0fdf4; }
        .result.error { border-left-color: #f43f5e; background: #fef2f2; }
        .result h4 { margin-bottom: 10px; color: #333; }
        .result pre { background: white; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 13px; }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 任务管理区域 */
        .tasks-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .tasks-section h2 { color: #667eea; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 1.8em; }

        .task-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .task-item.completed { border-left-color: #4ade80; }
        .task-item.failed { border-left-color: #f43f5e; }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .task-title { font-size: 1.2em; font-weight: 600; color: #333; }
        .task-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .task-status.processing { background: #fef3c7; color: #92400e; }
        .task-status.completed { background: #d1fae5; color: #065f46; }
        .task-status.failed { background: #fee2e2; color: #991b1b; }

        .task-info { color: #666; font-size: 14px; margin-bottom: 10px; }
        .task-id { font-family: monospace; background: white; padding: 4px 8px; border-radius: 5px; }

        /* 音乐播放器 */
        .music-player {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            color: white;
        }
        .player-title { font-size: 1.1em; font-weight: 600; margin-bottom: 10px; }
        .player-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .player-controls audio { flex: 1; min-width: 200px; }
        .player-controls button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .player-controls button:hover { background: rgba(255,255,255,0.3); }

        .lyrics-display {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
        }

        .empty-tasks {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-tasks svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .workflow-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 AI创作平台</h1>
            <p>音乐创作工作流 - 演示版</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>服务运行中</span>
            </div>
            <div class="status-item">
                <span>💰 积分余额: <strong id="credits">-</strong></span>
            </div>
        </div>

        <!-- 任务管理区域 -->
        <div class="tasks-section">
            <h2>🎵 我的音乐任务</h2>
            <div id="tasksList"></div>
        </div>

        <!-- 创作工作流卡片 -->
        <div class="workflow-grid">
            <!-- 灵感写歌 -->
            <div class="workflow-card">
                <h2>💡 灵感写歌</h2>
                <p class="description">输入创作灵感,AI自动生成歌词并创作音乐</p>
                <form id="inspirationForm" onsubmit="handleInspiration(event)">
                    <div class="form-group">
                        <label>✨ 创作灵感</label>
                        <textarea name="inspiration" required placeholder="例如：冬日咖啡馆的温暖午后"></textarea>
                    </div>
                    <div class="form-group">
                        <label>🎼 音乐风格</label>
                        <select name="style">
                            <option value="流行">流行</option>
                            <option value="民谣">民谣</option>
                            <option value="摇滚">摇滚</option>
                            <option value="电子">电子</option>
                            <option value="爵士">爵士</option>
                            <option value="古风">古风</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🎭 情绪基调(可选)</label>
                        <input type="text" name="mood" placeholder="例如：温暖、舒缓">
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" name="auto_generate" checked> 自动生成音乐</label>
                    </div>
                    <button type="submit" class="btn">✨ 开始创作</button>
                </form>
                <div id="inspirationResult"></div>
            </div>

            <!-- 图片成歌 -->
            <div class="workflow-card">
                <h2>🖼️ 图片成歌</h2>
                <p class="description">上传图片,AI分析后创作匹配的音乐</p>
                <form id="imageForm" onsubmit="handleImageToSong(event)">
                    <div class="form-group">
                        <label>🖼️ 图片URL</label>
                        <input type="url" name="image_url" required placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>💬 额外提示(可选)</label>
                        <textarea name="additional_prompt" placeholder="对创作的额外要求"></textarea>
                    </div>
                    <button type="submit" class="btn">🎨 开始创作</button>
                </form>
                <div id="imageResult"></div>
            </div>

            <!-- AI翻唱 -->
            <div class="workflow-card">
                <h2>🎤 AI翻唱</h2>
                <p class="description">上传音频文件,进行AI翻唱</p>
                <form id="coverForm" onsubmit="handleCover(event)">
                    <div class="form-group">
                        <label>🎵 音频文件</label>
                        <input type="file" name="file" accept="audio/*" required>
                    </div>
                    <div class="form-group">
                        <label>🎭 目标风格</label>
                        <input type="text" name="target_style" required placeholder="例如：爵士、摇滚">
                    </div>
                    <div class="form-group">
                        <label>📝 新标题(可选)</label>
                        <input type="text" name="new_title" placeholder="翻唱版标题">
                    </div>
                    <button type="submit" class="btn">🎵 开始翻唱</button>
                </form>
                <div id="coverResult"></div>
            </div>

            <!-- 完整创作流 -->
            <div class="workflow-card">
                <h2>🎬 完整创作流</h2>
                <p class="description">一站式完成: 歌词→音乐→封面→MV</p>
                <form id="fullForm" onsubmit="handleFullWorkflow(event)">
                    <div class="form-group">
                        <label>💡 创作灵感</label>
                        <textarea name="inspiration" required placeholder="描述你的创作主题"></textarea>
                    </div>
                    <div class="form-group">
                        <label>🎼 音乐风格</label>
                        <select name="style">
                            <option value="流行">流行</option>
                            <option value="民谣">民谣</option>
                            <option value="摇滚">摇滚</option>
                            <option value="电子">电子</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" name="create_cover"> 生成专辑封面</label>
                        <label><input type="checkbox" name="create_video"> 生成MV视频</label>
                    </div>
                    <button type="submit" class="btn">🎬 启动完整流程</button>
                </form>
                <div id="fullResult"></div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let activeTasks = new Map();
        let pollInterval = null;

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadCredits();
            loadTasks();
            startPolling();
        });

        // 加载积分
        async function loadCredits() {
            try {
                const res = await fetch('/api/suno/credits');
                const data = await res.json();
                if (data.code === 200) {
                    document.getElementById('credits').textContent = data.data.credits || data.data;
                }
            } catch (e) {
                console.error('加载积分失败:', e);
            }
        }

        // 加载任务列表
        function loadTasks() {
            const container = document.getElementById('tasksList');
            if (activeTasks.size === 0) {
                container.innerHTML = `
                    <div class="empty-tasks">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                        </svg>
                        <p>暂无音乐任务<br>开始创作你的第一首歌曲吧!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            activeTasks.forEach((task, taskId) => {
                html += renderTask(taskId, task);
            });
            container.innerHTML = html;
        }

        // 渲染单个任务
        function renderTask(taskId, task) {
            const statusClass = task.status === 'completed' ? 'completed' : task.status === 'failed' ? 'failed' : '';
            const statusText = task.status === 'completed' ? '✅ 已完成' : task.status === 'failed' ? '❌ 失败' : '⏳ 处理中';

            let playerHTML = '';
            if (task.status === 'completed' && task.data && task.data.length > 0) {
                const music = task.data[0];
                playerHTML = `
                    <div class="music-player">
                        <div class="player-title">🎵 ${music.title || '未命名'}</div>
                        <div class="player-controls">
                            <audio controls src="${music.audio_url}" preload="metadata"></audio>
                            <button onclick="downloadMusic('${music.audio_url}', '${music.title}')">💾 下载</button>
                            ${music.image_url ? `<button onclick="window.open('${music.image_url}', '_blank')">🖼️ 封面</button>` : ''}
                        </div>
                        ${task.lyrics ? `<div class="lyrics-display">${task.lyrics}</div>` : ''}
                    </div>
                `;
            }

            return `
                <div class="task-item ${statusClass}">
                    <div class="task-header">
                        <div class="task-title">${task.title || '音乐创作任务'}</div>
                        <div class="task-status ${task.status}">${statusText}</div>
                    </div>
                    <div class="task-info">
                        <span class="task-id">${taskId}</span>
                        <span style="margin-left: 15px;">创建时间: ${task.created || new Date().toLocaleString()}</span>
                    </div>
                    ${playerHTML}
                </div>
            `;
        }

        // 开始轮询任务状态
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if (activeTasks.size === 0) return;

                for (const [taskId, task] of activeTasks.entries()) {
                    if (task.status === 'processing') {
                        await checkTaskStatus(taskId);
                    }
                }
            }, 5000); // 每5秒检查一次
        }

        // 检查任务状态
        async function checkTaskStatus(taskId) {
            try {
                const res = await fetch(`/api/suno/task/${taskId}`);
                const payload = await res.json();

                if (payload.code === 200 && payload.data) {
                    const normalized = payload.data;
                    const task = activeTasks.get(taskId);

                    if (!task) {
                        return;
                    }

                    if (normalized.status === 'complete') {
                        task.status = 'completed';
                        task.data = normalized.tracks || [];
                        task.message = normalized.message || '';
                        loadTasks();
                        loadCredits(); // 更新积分
                    } else if (normalized.status === 'error') {
                        task.status = 'failed';
                        task.error = normalized.error_message || normalized.message || '生成失败';
                        loadTasks();
                    }
                }
            } catch (e) {
                console.error('检查任务状态失败:', e);
            }
        }

        // 添加任务到列表
        function addTask(taskId, title, lyrics = '') {
            activeTasks.set(taskId, {
                title,
                status: 'processing',
                created: new Date().toLocaleString(),
                lyrics
            });
            loadTasks();
        }

        // 下载音乐
        function downloadMusic(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.mp3';
            a.click();
        }

        // 灵感写歌
        async function handleInspiration(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button');
            const resultDiv = document.getElementById('inspirationResult');

            const formData = new FormData(form);
            const data = {
                inspiration: formData.get('inspiration'),
                style: formData.get('style'),
                mood: formData.get('mood'),
                auto_generate: formData.get('auto_generate') === 'on'
            };

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 创作中...';
            resultDiv.innerHTML = '<div class="result">⏳ 正在生成歌词...</div>';

            try {
                const res = await fetch('/api/creative/inspiration-song', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.code === 200) {
                    const taskId = result.data.music_task_id;
                    const lyrics = result.data.lyrics;

                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h4>✅ 歌词生成成功!</h4>
                            <pre>${lyrics}</pre>
                            ${taskId ? '<p style="margin-top:10px;">🎵 音乐正在生成中，请在上方任务列表查看进度</p>' : ''}
                        </div>
                    `;

                    if (taskId) {
                        addTask(taskId, `灵感创作 - ${data.inspiration.substring(0, 20)}`, lyrics);
                    }

                    form.reset();
                } else {
                    throw new Error(result.msg || '创作失败');
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error"><h4>❌ 错误</h4><p>${e.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '✨ 开始创作';
            }
        }

        // 图片成歌
        async function handleImageToSong(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button');
            const resultDiv = document.getElementById('imageResult');

            const formData = new FormData(form);
            const imageFile = formData.get('image_file');
            const imageUrl = formData.get('image_url');

            if ((!imageFile || !imageFile.size) && !imageUrl) {
                resultDiv.innerHTML = '<div class="result error"><h4>❌ 错误</h4><p>请上传图片文件或输入图片URL</p></div>';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 创作中...';
            resultDiv.innerHTML = '<div class="result">⏳ 正在分析图片...</div>';

            try {
                let endpoint = '/api/creative/image-to-song';
                let requestOptions;

                if (imageFile && imageFile.size > 0) {
                    endpoint = '/api/creative/image-to-song/upload';
                    const uploadData = new FormData();
                    uploadData.append('image_file', imageFile);
                    if (formData.get('additional_prompt')) {
                        uploadData.append('additional_prompt', formData.get('additional_prompt'));
                    }
                    uploadData.append('auto_generate', 'true');
                    uploadData.append('model', 'V5');
                    requestOptions = { method: 'POST', body: uploadData };
                } else {
                    const payload = {
                        image_url: imageUrl,
                        additional_prompt: formData.get('additional_prompt'),
                        auto_generate: true,
                        model: 'V5'
                    };
                    requestOptions = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    };
                }

                const res = await fetch(endpoint, requestOptions);
                const result = await res.json();

                if (result.code === 200) {
                    const taskId = result.data.music_task_id;
                    const lyrics = result.data.lyrics;

                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h4>✅ 图片分析完成!</h4>
                            <p>推荐风格: ${result.data.recommended_style}</p>
                            <pre>${lyrics}</pre>
                            ${taskId ? '<p style="margin-top:10px;">🎵 音乐正在生成中，请在上方任务列表查看进度</p>' : ''}
                        </div>
                    `;

                    if (taskId) {
                        addTask(taskId, `图片创作 - ${result.data.image_analysis.emotion}`, lyrics);
                    }

                    form.reset();
                } else {
                    throw new Error(result.msg || '创作失败');
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error"><h4>❌ 错误</h4><p>${e.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🎨 开始创作';
            }
        }

        // AI翻唱
        async function handleCover(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button');
            const resultDiv = document.getElementById('coverResult');

            const formData = new FormData(form);

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 上传中...';
            resultDiv.innerHTML = '<div class="result">⏳ 正在上传文件...</div>';

            try {
                const res = await fetch('/api/creative/upload-cover', {
                    method: 'POST',
                    body: formData
                });

                const result = await res.json();

                if (result.code === 200) {
                    const taskId = result.data.task_id;

                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h4>✅ 文件上传成功!</h4>
                            <p>🎵 翻唱任务已提交，请在上方任务列表查看进度</p>
                        </div>
                    `;

                    addTask(taskId, `AI翻唱 - ${formData.get('target_style')}风格`);
                    form.reset();
                } else {
                    throw new Error(result.msg || '上传失败');
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error"><h4>❌ 错误</h4><p>${e.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🎵 开始翻唱';
            }
        }

        // 完整创作流
        async function handleFullWorkflow(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button');
            const resultDiv = document.getElementById('fullResult');

            const formData = new FormData(form);

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 创作中...';
            resultDiv.innerHTML = '<div class="result">⏳ 正在启动完整创作流程...</div>';

            try {
                const res = await fetch('/api/creative/full-workflow', {
                    method: 'POST',
                    body: formData
                });

                const result = await res.json();

                if (result.code === 200) {
                    const taskId = result.data.music_task_id;
                    const lyrics = result.data.lyrics;

                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h4>✅ 完整创作流程已启动!</h4>
                            <pre>${lyrics}</pre>
                            <p style="margin-top:10px;">🎵 音乐正在生成中，请在上方任务列表查看进度</p>
                        </div>
                    `;

                    addTask(taskId, `完整创作 - ${formData.get('inspiration').substring(0, 20)}`, lyrics);
                    form.reset();
                } else {
                    throw new Error(result.msg || '创作失败');
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error"><h4>❌ 错误</h4><p>${e.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🎬 启动完整流程';
            }
        }
    </script>
</body>
</html>
