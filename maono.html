<!doctype html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8" />

<title>Maono 音乐创作</title>

<style>

:root {

  --bg: #0f1115; --card: rgba(255,255,255,0.06);

  --border: rgba(255,255,255,0.08); --text: #f6f7fb;

  --muted: #9aa1b5; --accent: #f4b400; --mint: #38f2c0;

  --radius: 14px; --shadow: 0 20px 60px rgba(0,0,0,0.35);

}

*{box-sizing:border-box;} body{margin:0;font-family:"Segoe UI","HarmonyOS Sans",system-ui;background:linear-gradient(135deg,#0f1115 0%,#131722 100%);color:var(--text);}

a{color:var(--mint);} .page{display:flex;min-height:100vh;}

.sidebar{width:360px;padding:24px;backdrop-filter:blur(12px);background:var(--card);border-right:1px solid var(--border);} 

.main{flex:1;padding:24px 32px 32px;overflow-y:auto;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);} 

.titlebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}

h1{margin:0;font-size:22px;letter-spacing:0.5px;}

.label{font-size:13px;color:var(--muted);margin-bottom:6px;}

input,textarea,select,button{width:100%;background:#151924;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;}

textarea{min-height:90px;resize:vertical;}

button{background:linear-gradient(135deg,var(--accent),#ffcf5a);color:#0c0c0c;font-weight:700;border:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;}

button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(244,180,0,0.35);} 

.row{display:flex;gap:12px;} .row > *{flex:1;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:#1b1f2a;color:var(--muted);font-size:12px;}
.progress{height:6px;border-radius:999px;background:#1b1f2a;overflow:hidden;margin-top:10px;}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--mint),#6df5ff);} 
.track{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border-radius:10px;border:1px solid var(--border);} 
.track audio{width:240px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.poster{width:100%;border-radius:12px;border:1px solid var(--border);} 
.media-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:flex-start;}
.media-row .card{height:100%;}
.media-row .poster{max-width:100%;height:auto;}
.mode-block{display:none;}
.mode-block.active{display:block;}
</style>
</head>

<body>

<div class="page">

  <aside class="sidebar">

    <div class="titlebar">

      <h1>Maono 音乐创作</h1>

      <div class="badge">余额 <span id="credits">--</span></div>

    </div>

    <div class="card">
      <div class="label">模式</div>
      <select id="mode">
        <option value="inspiration">灵感成歌</option>
        <option value="image_to_song">图片成歌</option>
        <option value="extend">音乐续写</option>
        <option value="cover">歌曲翻唱</option>
        <option value="mv_storyboard">MV-分镜</option>
        <option value="mv_poster">MV-海报</option>
      </select>
      <div id="block-inspiration" class="mode-block active">
        <div class="label" style="margin-top:12px;">灵感 / 提示</div>
        <textarea id="input_inspiration" placeholder="描述灵感或粘贴歌词"></textarea>
        <div class="label">风格</div>
        <input id="style_inspiration" placeholder="如：氛围流行 / 城市夜色" />
      </div>

      <div id="block-image" class="mode-block">
        <div class="label" style="margin-top:12px;">图片 URL</div>
        <input id="media_image" placeholder="上传后会自动填入" />
        <div class="row">
          <div>
            <div class="label">本地图片</div>
            <input id="media_file" type="file" accept="image/*" />
          </div>
          <div>
            <button id="upload_image_btn" type="button" style="margin-top:22px;">选择图片并上传</button>
          </div>
        </div>
        <div class="label">额外要求</div>
        <textarea id="input_image" placeholder="情绪/歌词风格等"></textarea>
        <div class="label">风格</div>
        <input id="style_image" placeholder="如：氛围流行" />
      </div>

      <div id="block-extend" class="mode-block">
        <div class="label" style="margin-top:12px;">音频 ID</div>
        <input id="media_extend" placeholder="audioId" />
        <div class="label">选择已生成歌曲</div>
        <select id="saved_extend">
          <option value="">不选择</option>
        </select>
        <div class="label">续写提示（可选）</div>
        <textarea id="input_extend" placeholder="想续写的方向"></textarea>
        <div class="label">风格（可选）</div>
        <input id="style_extend" placeholder="如：流行" />
      </div>

      <div id="block-cover" class="mode-block">
        <div class="label" style="margin-top:12px;">音频 URL</div>
        <input id="media_cover" placeholder="上传或已有音频 URL" />
        <div class="label">选择已生成歌曲</div>
        <select id="saved_cover">
          <option value="">不选择</option>
        </select>
        <div class="label">标题（必填）</div>
        <input id="title_cover" placeholder="如：AI Cover" />
        <div class="label">歌词 / 提示（可选）</div>
        <textarea id="input_cover" placeholder="提供歌词或翻唱提示"></textarea>
        <div class="label">风格（可选）</div>
        <input id="style_cover" placeholder="如：流行" />
      </div>

      <div id="toggle-row" class="row" style="margin-top:10px;">
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="gen_image" style="width:auto;" /> 生成封面图
        </label>
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="gen_video" style="width:auto;" /> 生成视频
        </label>
      </div>

      <div class="row">
        <button id="generate-cover-existing" type="button" style="margin-top:6px;">已有歌曲生成封面（用媒体参数为目录名）</button>
        <button id="generate-video-existing" type="button" style="margin-top:6px;">已有歌曲生成视频（用媒体参数为目录名）</button>
      </div>
      <div class="label" style="margin-top:8px;">媒体参数/目录名（已有任务用）</div>
      <input id="media_saved" placeholder="用于已有歌曲封面/视频/保存目录" />

      <button id="submit" style="margin-top:14px;">生成 / 提交任务</button>
    </div>
  </aside>


  <main class="main">

    <div class="card">

      <div class="label">任务状态</div>

      <div class="badge" id="task-id">task: --</div>

      <div class="badge" id="task-status">status: idle</div>

      <div class="progress"><div class="progress-inner" id="progress" style="width:0%"></div></div>

    </div>



    <div class="card">

      <div class="label">音频播放</div>

      <div id="tracks"></div>

    </div>



    <div class="media-row">
      <div class="card">
        <div class="label">歌词</div>
        <div id="song-title" style="font-weight:700;color:var(--text);margin-bottom:6px;"></div>
        <pre id="lyrics" style="white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--muted);margin:0;"></pre>
      </div>

      <div class="card" id="mv-block" style="display:none;">
        <div class="label">图片 / 分镜</div>
        <div class="grid" id="mv-images"></div>
        <video id="mv-video" controls style="width:100%;margin-top:12px;border-radius:12px;display:none;"></video>
        <div id="poster-block" style="margin-top:12px;display:none;">
          <img id="poster" class="poster" alt="海报" />
        </div>
      </div>
    </div>
  </main>

</div>



<script>

let currentTaskId = null;

let pollTimer = null;

let lastLyricsText = '';
let lastTitleText = 'AI Song';
let savedTaskId = null;
let lastFolderName = '';
let videoPollTimer = null;
let videoTaskId = null;
let uploadingImage = false;
let savedSongs = [];
// 从歌词/提示首行推导标题，防止缺失
function deriveTitle(text = '', fallback = 'AI Song') {
  const line = (text || '').split(/\n/).map(s => s.trim()).find(Boolean);
  if (!line) return fallback;
  return line.slice(0, 40);
}
// API 基址：固定指向后端端口，避免静态服 5500 返回 HTML

const API_BASE = 'http://127.0.0.1:8000';
const api = (path) => `${API_BASE}${path}`;

function pickUrl(obj) {
  if (!obj) return null;
  return obj.url || obj.image_url || obj.imageUrl || obj.cover || null;
}

function updateModeUI() {
  const mode = document.getElementById('mode').value;
  const map = {
    inspiration: 'block-inspiration',
    image_to_song: 'block-image',
    extend: 'block-extend',
    cover: 'block-cover'
  };
  Object.values(map).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
  });
  const activeId = map[mode] || 'block-inspiration';
  const activeEl = document.getElementById(activeId);
  if (activeEl) activeEl.classList.add('active');
  // 显示/隐藏封面/视频开关：灵感成歌、图片成歌才展示
  const toggles = document.getElementById('toggle-row');
  if (toggles) {
    toggles.style.display = (mode === 'inspiration' || mode === 'image_to_song') ? 'flex' : 'none';
  }
}

function getModeValues() {
  const mode = document.getElementById('mode').value;
  if (mode === 'image_to_song') {
    return {
      mode,
      input: (document.getElementById('input_image')?.value || '').trim(),
      media: (document.getElementById('media_image')?.value || '').trim(),
      style: (document.getElementById('style_image')?.value || '').trim(),
      title: ''
    };
  }
  if (mode === 'extend') {
    return {
      mode,
      input: (document.getElementById('input_extend')?.value || '').trim(),
      media: (document.getElementById('media_extend')?.value || '').trim(),
      style: (document.getElementById('style_extend')?.value || '').trim(),
      title: ''
    };
  }
  if (mode === 'cover') {
    return {
      mode,
      input: (document.getElementById('input_cover')?.value || '').trim(),
      media: (document.getElementById('media_cover')?.value || '').trim(),
      style: (document.getElementById('style_cover')?.value || '').trim(),
      title: (document.getElementById('title_cover')?.value || '').trim()
    };
  }
  // 默认灵感成歌
  return {
    mode,
    input: (document.getElementById('input_inspiration')?.value || '').trim(),
    media: '',
    style: (document.getElementById('style_inspiration')?.value || '').trim(),
    title: ''
  };
}


async function saveMedia(url, kind) {

  if (!url) return;

  const folder = lastFolderName || lastTitleText || currentTaskId || 'untitled';

  try {

    const res = await fetch(api('/api/doubao/media/save'), {

      method: 'POST',

      headers: {'Content-Type': 'application/json'},

      body: JSON.stringify({ url, folder, kind })

    });

    const json = await res.json();

    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '保存失败');

    console.log('媒体已保存', json.data && json.data.path);

  } catch (e) {

    console.warn('媒体保存失败', e);

  }

}



async function fetchLyrics(userPrompt) {
  // 调用豆包歌词生成 -> 回退 Suno 歌词生成 -> 再回退用户输入
  try {
    // 1) 豆包歌词
    const res = await fetch(api('/api/doubao/lyrics'), {
      method: 'POST',

      headers: {'Content-Type': 'application/json'},

      body: JSON.stringify({ prompt: userPrompt })

    });

    const json = await res.json();

    if (json.code && json.code !== 200) throw new Error(json.error || json.msg || json.message || '歌词提交失败');
    // 豆包歌词直接返回 text/title
    const data = json.data || {};
    const rawText = data.text || data.lyrics;
    const title = data.title || deriveTitle(rawText || userPrompt, 'AI Song');
    if (rawText) return { text: rawText, title };
  } catch (e) {
    console.warn('豆包歌词失败，尝试 Suno 歌词', e);
    // 2) Suno 歌词

    try {

      const res = await fetch(api('/api/suno/lyrics'), {

        method: 'POST',

        headers: {'Content-Type': 'application/json'},

        body: JSON.stringify({ prompt: userPrompt })

      });

      const json = await res.json();

      if (json.code && json.code !== 200) throw new Error(json.error || json.msg || json.message || '歌词提交失败');

      const taskId = json.data && (json.data.task_id || json.data.taskId || json.data);

      if (!taskId) throw new Error('歌词任务ID缺失');

      for (let i = 0; i < 15; i++) {

        const r = await fetch(api(`/api/suno/lyrics-task/${taskId}`));

        const jr = await r.json();

        const data = jr.data || {};

        const status = (data.status || '').toUpperCase();

        if (status === 'SUCCESS' || status === 'FINISH') {

          const items = (((data.response || {}).data) || []);

          const first = items[0] || {};

          return {

            text: first.text || userPrompt,

            title: first.title || 'AI Song'

          };

        }

        await new Promise(res => setTimeout(res, 1500));

      }

    } catch (e2) {

      console.warn('Suno 歌词也失败，使用用户输入', e2);

    }

  }

  return { text: userPrompt, title: 'AI Song' };

}



function setStatus(text, percent) {

  document.getElementById('task-status').textContent = `status: ${text}`;

  document.getElementById('progress').style.width = `${percent}%`;

}



function renderTracks(tracks = []) {

  const box = document.getElementById('tracks');

  box.innerHTML = '';

  tracks.forEach(t => {

    const div = document.createElement('div');

    div.className = 'track';

    div.innerHTML = `<div>${t.title || '未命名'} · ${t.duration || '--'}s</div>

      <audio controls src="${t.audio_url || t.stream_audio_url || ''}"></audio>`;

    box.appendChild(div);

  });

}



function renderMV({ images = [], video, poster }) {

  const mvBlock = document.getElementById('mv-block');

  const mvImages = document.getElementById('mv-images');

  const mvVideo = document.getElementById('mv-video');

  const posterBlock = document.getElementById('poster-block');

  const posterImg = document.getElementById('poster');



  mvBlock.style.display = images.length || video ? 'block' : 'none';

  posterBlock.style.display = poster ? 'block' : 'none';



  mvImages.innerHTML = '';

  images.forEach(url => {

    const img = document.createElement('img');

    img.src = url;

    img.className = 'poster';

    mvImages.appendChild(img);

  });



  mvVideo.style.display = video ? 'block' : 'none';

  if (video) mvVideo.src = video;

  if (poster) posterImg.src = poster;

}



async function generateCoverFromLyrics(lyricsText, styleText) {

  try {

    const prompt = `根据以下歌词生成一张专辑封面，突出情绪和意境：\n${lyricsText}\n风格：${styleText || '流行'}`;

    const res = await fetch(api('/api/doubao/image/generate'), {

      method: 'POST',

      headers: {'Content-Type': 'application/json'},

      body: JSON.stringify({ prompt, size: "2K", response_format: "url", watermark: false })

    });

    const json = await res.json();

    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '封面生成失败');

    const data = json.data || {};

    const url = pickUrl(data) || pickUrl((data.results || [])[0]);

    if (url) {

      renderMV({ images: [url] });

      saveMedia(url, 'image');

    }

  } catch (e) {

    console.warn('封面生成失败', e);

  }

}



async function understandImage(imageUrl) {

  try {

    const res = await fetch(api('/api/doubao/image/understand'), {

      method: 'POST',

      headers: {'Content-Type': 'application/json'},

      body: JSON.stringify({ image_url: imageUrl, question: '请描述图片的场景、主体、情绪和风格，用于写歌。' })

    });

    const json = await res.json();

    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '图片理解失败');

    const data = json.data || {};

    return data.description || data.answer || data.scene || JSON.stringify(data);

  } catch (e) {

    console.warn('图片理解失败', e);

    return imageUrl;

  }

}



async function imageToLyrics(imageUrl, extraPrompt = '') {
  try {
    const res = await fetch(api('/api/doubao/image/lyrics'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ image_url: imageUrl, prompt: extraPrompt || '' })

    });

    const json = await res.json();

    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '图片生成歌词失败');

    const data = json.data || {};

    const lyrics = data.lyrics || data.text;

    const title = data.title || 'AI Song';

    const desc = data.description || data.raw || '';

    return { text: lyrics, title, desc };

  } catch (e) {
    console.warn('图片生成歌词失败，准备降级：', e);
    return null;
  }
}

async function uploadLocalImage() {
  const fileInput = document.getElementById('media_file');
  const btn = document.getElementById('upload_image_btn');
  if (!fileInput || !btn) return;
  if (!fileInput.files || fileInput.files.length === 0) {
    alert('请选择一张图片');
    return;
  }
  if (uploadingImage) return;
  const file = fileInput.files[0];
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_path', 'images');

  uploadingImage = true;
  const oldText = btn.textContent;
  btn.textContent = '上传中...';
  btn.disabled = true;

  try {
    const res = await fetch(api('/api/upload/image'), {
      method: 'POST',
      body: fd
    });
    const json = await res.json();
    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '上传失败');
    const data = json.data || {};
    const url = data.url || json.url || data;
    if (!url) throw new Error('上传成功但未返回 URL');
    const mediaInput = document.getElementById('media_image');
    if (mediaInput) mediaInput.value = url;
    document.getElementById('mode').value = 'image_to_song';
    updateModeUI();
    setStatus('image ready', 15);
  } catch (e) {
    console.warn('本地图片上传失败', e);
    alert(`上传失败：${e.message || e}`);
  } finally {
    uploadingImage = false;
    btn.textContent = oldText;
    btn.disabled = false;
  }
}

async function loadSavedSongs() {
  try {
    const res = await fetch(api('/api/suno/saved'));
    const json = await res.json();
    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '获取已保存歌曲失败');
    savedSongs = json.data || [];
    const optExtend = document.getElementById('saved_extend');
    const optCover = document.getElementById('saved_cover');
    if (!optExtend || !optCover) return;
    const render = (selectEl) => {
      selectEl.innerHTML = '<option value=\"\">不选择</option>';
      savedSongs.forEach(item => {
        const tracks = item.tracks || [];
        tracks.forEach((t, idx) => {
          const option = document.createElement('option');
          option.value = t.audio_id || t.audio_url || '';
          option.dataset.audioUrl = t.audio_url || t.stream_audio_url || '';
          option.dataset.title = item.title || '';
          option.dataset.style = item.style || '';
          option.dataset.dir = item.dir || '';
          option.dataset.trackIndex = idx;
          option.textContent = `${item.title || '未命名'} · track${idx + 1}`;
          selectEl.appendChild(option);
        });
      });
    };
    render(optExtend);
    render(optCover);
  } catch (e) {
    console.warn('加载已保存歌曲失败', e);
  }
}
async function pollTask() {

  if (!currentTaskId) return;

  try {

    const res = await fetch(api(`/api/suno/task/${currentTaskId}`));

    const json = await res.json();

    const data = json.data || {};

    const status = data.status || 'processing';

    setStatus(status, status === 'complete' ? 100 : 60);

    if (status === 'complete') {

      renderTracks(data.tracks || []);

      clearInterval(pollTimer);

      pollTimer = null;

      if (currentTaskId && savedTaskId !== currentTaskId) {

        savedTaskId = currentTaskId;

        saveSong(currentTaskId);

      }

    }

  } catch (e) { console.error(e); }

}



async function pollVideoTask() {
  if (!videoTaskId) return;
  try {
    const res = await fetch(api(`/api/doubao/video/task/${videoTaskId}`));
    const json = await res.json();
    const data = json.data || {};

    const status = (data.status || '').toLowerCase();

    if (status === 'succeeded' || status === 'success' || status === 'complete') {

      // 尝试拿 url

      const url = pickUrl(data) || pickUrl((data.data || [])[0]) || pickUrl((data.response || {}).data && (data.response.data[0]));

      if (url) {

        renderMV({ images: [], video: url });

        saveMedia(url, 'video');

      }

      if (videoPollTimer) {

        clearInterval(videoPollTimer);

        videoPollTimer = null;

      }

      videoTaskId = null;

    }

  } catch (e) {

    console.warn('视频轮询失败', e);

  }
}

document.getElementById('upload_image_btn').onclick = uploadLocalImage;
document.getElementById('saved_extend').onchange = (e) => {
  const audioId = e.target.value;
  if (audioId) {
    const audioUrl = e.target.selectedOptions[0].dataset.audiourl || '';
    document.getElementById('media_extend').value = audioId || audioUrl;
    const style = e.target.selectedOptions[0].dataset.style || '';
    if (style) document.getElementById('style_extend').value = style;
  }
};
document.getElementById('saved_cover').onchange = (e) => {
  const audioId = e.target.value;
  if (audioId) {
    const audioUrl = e.target.selectedOptions[0].dataset.audiourl || '';
    document.getElementById('media_cover').value = audioUrl || audioId;
    const style = e.target.selectedOptions[0].dataset.style || '';
    if (style) document.getElementById('style_cover').value = style;
    const title = e.target.selectedOptions[0].dataset.title || '';
    if (title) document.getElementById('title_cover').value = title;
  }
};

document.getElementById('submit').onclick = async () => {
  const { mode, input, media, style } = getModeValues();
  const genImage = document.getElementById('gen_image').checked;
  const genVideo = document.getElementById('gen_video').checked;


  // 豆包负责歌词生成；Suno 负责音乐生成/续写/翻唱

  let url = '/api/suno/generate';

  let payload = {};



  // 尝试先生成歌词（除 extend/cover 外）

  let lyricsText = input;

  let titleText = 'AI Song';

  if (mode !== 'extend' && mode !== 'cover') {

    let promptForLyrics = input;

    let lyricsGenerated = false;

    if (mode === 'image_to_song' && media) {

      // 优先图片直出歌词，失败再用描述+文本生成

      const imgLyrics = await imageToLyrics(media, input);

      if (imgLyrics && imgLyrics.text) {

        lyricsText = imgLyrics.text;

        titleText = imgLyrics.title || deriveTitle(imgLyrics.text, 'AI Song');

        lyricsGenerated = true;

      } else {

        const desc = await understandImage(media);

        promptForLyrics = `${desc}\n\n额外要求：${input}`;

      }

    }

    if (!lyricsGenerated) {

      const lyr = await fetchLyrics(promptForLyrics);

      lyricsText = lyr.text || promptForLyrics || input;

      titleText = lyr.title || deriveTitle(lyricsText || promptForLyrics || input, 'AI Song');

    }

    document.getElementById('lyrics').textContent = lyricsText;
  const titleBox = document.getElementById('song-title');
  if (titleBox) titleBox.textContent = titleText || '';
  }

  lastLyricsText = lyricsText;

  lastTitleText = titleText;



  if (mode === 'extend') {
    url = '/api/suno/extend';
    payload = {
      audio_id: media,
      model: 'V5',
      continueAt: null,

      defaultParamFlag: false,

      prompt: input || undefined,

      style: style || undefined,

      title: undefined

    };

  } else if (mode === 'cover') {
    // 如果未填 URL 但选择了已保存歌曲，则走 cover-from-saved，用本地 mp3 再上传翻唱
    const savedSelect = document.getElementById('saved_cover');
    const selected = savedSelect?.selectedOptions?.[0];
    const dir = selected?.dataset?.dir || '';
    const trackIndex = selected?.dataset?.trackindex;
    const hasSaved = dir && trackIndex !== undefined && selected?.value;
    const titleForCover = title || selected?.dataset?.title || lastTitleText || deriveTitle(lyricsText || input, 'AI Cover');
    const styleForCover = style || selected?.dataset?.style || 'Pop';
    lastTitleText = titleForCover;
    if (!media && hasSaved) {
      url = '/api/suno/cover-from-saved';
      payload = {
        dir,
        track_index: Number(trackIndex) || 0,
        prompt: input || undefined,
        style: styleForCover,
        title: titleForCover
      };
    } else {
      url = '/api/suno/cover';
      payload = {
        uploadUrl: media,
        model: 'V5',
        customMode: true,
        prompt: input || undefined,
        style: styleForCover,
        title: titleForCover
      };
    }
  } else {
    // 使用歌词文本走 customMode=true，补齐 title/style

    payload = {

      prompt: lyricsText,

      customMode: true,

      instrumental: false,

      model: 'V5',

      title: titleText,

      style: style || 'Pop'

    };

  }



  try {

    setStatus('submitting', 10);

    const res = await fetch(api(url), {

      method: 'POST',

      headers: {'Content-Type':'application/json'},

      body: JSON.stringify(payload)

    });

    const json = await res.json();

    if (json.code && json.code !== 200) throw new Error(json.error || json.msg || json.message || '提交失败');

    const data = json.data || {};

    const maybeId = data.task_id || data;

    currentTaskId = (typeof maybeId === 'string') ? maybeId : null;

    document.getElementById('task-id').textContent = `task: ${currentTaskId || '--'}`;

    document.getElementById('lyrics').textContent = lyricsText || input || '';

    renderTracks([]); renderMV({images:[],video:null,poster:null});

    if (genImage) {

      generateCoverFromLyrics(lyricsText, style || 'Pop');

    }

    if (genVideo) {

      // 用歌词+风格生成视频任务

      const videoPrompt = `为以下歌词生成音乐视频，突出歌词意境与风格：\n${lyricsText}\n风格：${style || '流行'}\n--ratio 16:9 --dur 10`;

      try {

        const vres = await fetch(api('/api/doubao/video/generate'), {

          method: 'POST',

          headers: {'Content-Type': 'application/json'},

          body: JSON.stringify({ prompt: videoPrompt, ratio: "16:9", duration: 10 })

        });

        const vjson = await vres.json();

        if (vjson.code && vjson.code !== 200) throw new Error(vjson.detail || vjson.message || '视频生成失败');

        const vdata = vjson.data || {};

        videoTaskId = vdata.task_id || vdata.taskId || vdata.id;

        if (videoTaskId) {

          if (videoPollTimer) clearInterval(videoPollTimer);

          videoPollTimer = setInterval(pollVideoTask, 8000);

          pollVideoTask();

        }

      } catch (e) {

        console.warn('视频生成失败', e);

      }

    }

    if (currentTaskId) {

      if (pollTimer) clearInterval(pollTimer);

      // 增大轮询间隔，允许长时间生成；不设置总体超时

      pollTimer = setInterval(pollTask, 30000);

      pollTask();

    } else { setStatus('ready', 100); }

  } catch (e) {

    console.error(e);

    setStatus('error', 0);

    alert(`提交失败：${e.message}`);

  }

};



async function refreshCredits() {

  try {

    const res = await fetch(api('/api/suno/credits'));

    const json = await res.json();

    const credits = (json && json.data && (json.data.credits ?? json.data)) ?? '--';

    document.getElementById('credits').textContent = credits;

  } catch (e) {

    document.getElementById('credits').textContent = '--';

  }

}

refreshCredits();



async function saveSong(taskId) {
  try {
    const styleFromMode = getModeValues().style || '';
    const res = await fetch(api('/api/suno/save'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ task_id: taskId, lyrics_text: lastLyricsText, title: lastTitleText, style: styleFromMode })
    });
    const json = await res.json();
    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '保存失败');
    console.log('已保存到', json.data && json.data.dir);
    loadSavedSongs();
  } catch (e) {
    console.warn('保存失败', e);
  }
}

document.getElementById('generate-cover-existing').onclick = async () => {
  const folder = (document.getElementById('media_saved')?.value || '').trim();
  const style = getModeValues().style || '';
  if (!folder) {
    alert('请在媒体参数输入已保存歌曲的目录名（downloads 下）');
    return;
  }
  try {
    const res = await fetch(api('/api/doubao/image/cover-from-saved'), {

      method: 'POST',

      headers: {'Content-Type': 'application/json'},

      body: JSON.stringify({ folder, style })

    });

    const json = await res.json();

    if (json.code && json.code !== 200) throw new Error(json.detail || json.message || '生成封面失败');

    const data = json.data || {};

    const url = pickUrl(data) || pickUrl((data.results || [])[0]);

    if (url) {

      renderMV({ images: [url] });

      saveMedia(url, 'image');

    }

  } catch (e) {

    alert(`生成封面失败：${e.message}`);

  }

};

document.getElementById('generate-video-existing').onclick = async () => {
  const folder = (document.getElementById('media_saved')?.value || '').trim();
  const style = getModeValues().style || '流行';
  if (!folder) {
    alert('请在媒体参数输入已保存歌曲的目录名（downloads 下）');
    return;
  }
  try {

    const lyricsPath = `downloads/${folder}/lyrics.txt`;

    const resLyrics = await fetch(lyricsPath);

    const lyricsText = resLyrics.ok ? await resLyrics.text() : '';

    const videoPrompt = `为以下歌词生成音乐视频，突出歌词意境与风格：\n${lyricsText || folder}\n风格：${style}\n--ratio 16:9 --dur 10`;

    const vres = await fetch(api('/api/doubao/video/generate'), {

      method: 'POST',

      headers: {'Content-Type': 'application/json'},

      body: JSON.stringify({ prompt: videoPrompt, ratio: "16:9", duration: 10 })

    });

    const vjson = await vres.json();

    if (vjson.code && vjson.code !== 200) throw new Error(vjson.detail || vjson.message || '视频生成失败');

    const vdata = vjson.data || {};

    videoTaskId = vdata.task_id || vdata.taskId || vdata.id;

    if (videoTaskId) {

      if (videoPollTimer) clearInterval(videoPollTimer);

      videoPollTimer = setInterval(pollVideoTask, 8000);

      pollVideoTask();

    }

  } catch (e) {

    alert(`生成视频失败：${e.message}`);
  }
};

document.getElementById('mode').onchange = updateModeUI;
updateModeUI();
loadSavedSongs();
</script>
